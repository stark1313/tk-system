<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .transaction-list-page .search-panel {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .transaction-list-page .search-panel .form-control {
      min-height: 48px;
    }
    .transaction-list-page .search-controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .transaction-list-page .search-controls button {
      min-width: 120px;
    }
    .transaction-list-table {
      table-layout: fixed;
      width: 100%;
    }
    .transaction-list-table th,
    .transaction-list-table td {
      vertical-align: middle;
      border-color: rgba(0, 0, 0, 0.08);
      border-right: 1px solid rgba(0,0,0,0.08);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .transaction-list-table th:nth-child(1),
    .transaction-list-table td:nth-child(1) {
      width: 40px;
    }
    .transaction-list-table th:nth-child(2),
    .transaction-list-table td:nth-child(2) {
      width: 90px;
    }
    .transaction-list-table th:nth-child(3),
    .transaction-list-table td:nth-child(3) {
      width: 100px;
    }
    .transaction-list-table th:nth-child(4),
    .transaction-list-table td:nth-child(4) {
      width: 120px;
    }
    .transaction-list-table th:nth-child(5),
    .transaction-list-table td:nth-child(5) {
      width: 150px;
    }
    .transaction-list-table th:nth-child(6),
    .transaction-list-table td:nth-child(6) {
      width: 110px;
    }
    .transaction-list-table th:nth-child(7),
    .transaction-list-table td:nth-child(7) {
      width: 110px;
    }
    .transaction-list-table th:nth-child(8),
    .transaction-list-table td:nth-child(8) {
      width: 110px;
    }
    .transaction-list-table th:last-child,
    .transaction-list-table td:last-child {
      border-right: none;
    }
    .transaction-list-table th {
      text-align: center;
      background: #f8f9fa;
      font-weight: 600;
    }
    .transaction-list-table td {
      text-align: center;
    }
    .transaction-list-table td.project-col {
      text-align: left;
    }
    .transaction-list-table td.amount-col {
      text-align: right;
    }
    .transaction-list-page .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .customer-suggestions {
      position: absolute;
      z-index: 10;
      width: 100%;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 0.25rem;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
    .customer-suggestions.show {
      display: block;
    }
    .customer-suggestions li {
      padding: 0.5rem 0.75rem;
      cursor: pointer;
    }
    .customer-suggestions li:hover {
      background: #f8f9fa;
    }
    .transaction-list-table tbody tr {
      cursor: pointer;
    }
    .transaction-list-table tbody tr:hover {
      background: #f1f3f5;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand">
      <a href="../index.html">태경산업 주문관리 시스템</a>
    </div>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>거래관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link active" href="transaction_list.html">주문관리</a></li>
      <li class="nav-item"><a class="nav-link" href="transaction_settlement.html">정산관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기준정보</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="customer_list.html">거래처관리</a></li>
      <li class="nav-item"><a class="nav-link" href="item_list.html">품목관리</a></li>
      <li class="nav-item"><a class="nav-link" href="form_upload.html">서식업로드</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>재고관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="inventory_list.html">재고관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기타</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="document_list.html">자료실</a></li>
      <li class="nav-item"><a class="nav-link" href="https://www.g2b.go.kr" target="_blank" rel="noopener">나라장터</a></li>
      <li class="nav-item"><a class="nav-link" href="https://mail.naver.com" target="_blank" rel="noopener">메일</a></li>
      <li class="nav-item"><a class="nav-link" href="company_info.html">회사정보</a></li>
    </ul>
  </div>
  <main class="main-content transaction-list-page">
    <h2>주문관리</h2>

    <section class="search-panel mb-4">
      <form id="transaction-search-form" class="row g-3 align-items-end">
        <div class="col-md-4 position-relative">
          <label for="search-customer" class="form-label">거래처</label>
          <input type="text" id="search-customer" class="form-control" autocomplete="off" placeholder="거래처명을 입력하세요">
          <ul id="customer-suggestions" class="customer-suggestions list-group"></ul>
        </div>
        <div class="col-md-4">
          <label for="search-project" class="form-label">공사명</label>
          <input type="text" id="search-project" class="form-control" placeholder="공사명을 입력하세요">
        </div>
        <div class="col-md-4">
          <div class="row g-2">
            <div class="col-auto">
              <label for="search-from-year" class="form-label">기간</label>
              <select id="search-from-year" class="form-select">
                <option value="">년도</option>
              </select>
            </div>
            <div class="col-auto">
              <label class="form-label" style="visibility: hidden;">.</label>
              <select id="search-from-month" class="form-select">
                <option value="">월</option>
              </select>
            </div>
            <div class="col-auto d-flex align-items-end">
              <span class="text-muted">~</span>
            </div>
            <div class="col-auto">
              <label class="form-label" style="visibility: hidden;">.</label>
              <select id="search-to-year" class="form-select">
                <option value="">년도</option>
              </select>
            </div>
            <div class="col-auto">
              <label class="form-label" style="visibility: hidden;">.</label>
              <select id="search-to-month" class="form-select">
                <option value="">월</option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-12 text-center search-controls">
          <button type="button" id="search-reset" class="btn btn-outline-secondary">초기화</button>
          <button type="submit" class="btn btn-primary">검색</button>
        </div>
      </form>
    </section>

    <section class="table-responsive">
      <div class="d-flex justify-content-end mb-3 gap-2">
        <button type="button" id="create-transaction-btn" class="btn btn-primary">신규</button>
        <button type="button" id="delete-transaction-btn" class="btn btn-danger">삭제</button>
      </div>
      <table class="table transaction-list-table">
        <thead>
          <tr>
            <th style="width: 40px;"><input type="checkbox" id="select-all-checkbox" class="form-check-input"></th>
            <th>거래번호</th>
            <th>거래처</th>
            <th>공사명</th>
            <th>주요 주문내역</th>
            <th>금액</th>
            <th>입력일자</th>
            <th>수정일자</th>
          </tr>
        </thead>
        <tbody id="transaction-table-body"></tbody>
      </table>
    </section>

    <nav class="pagination-container" aria-label="주문내역 페이지네이션">
      <ul class="pagination justify-content-center mb-0" id="transaction-pagination"></ul>
    </nav>
  </main>

  <!-- 삭제 확인 모달 -->
  <div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteConfirmLabel">삭제 확인</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="deleteConfirmMessage">삭제하시겠습니까?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 삭제 완료 모달 -->
  <div class="modal fade" id="deleteCompleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteCompleteLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteCompleteLabel">알림</h5>
        </div>
        <div class="modal-body">
          <p>삭제가 완료되었습니다.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="deleteCompleteBtn" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app_config.js?v=20260420"></script>
  <script src="../js/script.js"></script>
  <script src="../js/db_sync.js"></script>
</body>
</html>
