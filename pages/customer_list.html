<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래처관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .customer-section {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .customer-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .customer-table th,
    .customer-table td {
      padding: 0.75rem;
      border: 1px solid #ddd;
      text-align: center;
    }
    .customer-table th {
      background: #f8f9fa;
      font-weight: 600;
    }
    .customer-table td.left-align {
      text-align: left;
    }
    .customer-table input,
    .customer-table select {
      width: 100%;
      padding: 0.35rem;
      border: 1px solid #ddd;
      border-radius: 0.25rem;
      font-size: 0.85rem;
      box-sizing: border-box;
    }
    .control-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .control-buttons button {
      min-width: 100px;
    }
    .add-row-btn {
      background: #28a745;
      color: white;
      border: none;
      border-radius: 0.25rem;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      padding: 0;
    }
    .add-row-btn:hover {
      background: #218838;
    }
    .add-row-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #6c757d;
    }
    .minus-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 0.25rem;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-weight: bold;
      padding: 0;
    }
    .minus-btn:hover {
      background: #c82333;
    }
    .minus-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand">
      <a href="../index.html">태경산업 주문관리 시스템</a>
    </div>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>거래관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="transaction_list.html">주문관리</a></li>
      <li class="nav-item"><a class="nav-link" href="transaction_settlement.html">주문정산</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기준정보</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link active" href="customer_list.html">거래처관리</a></li>
      <li class="nav-item"><a class="nav-link" href="item_list.html">품목관리</a></li>
      <li class="nav-item"><a class="nav-link" href="form_upload.html">서식업로드</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>재고관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="inventory_list.html">재고관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기타</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="document_list.html">자료실</a></li>
      <li class="nav-item"><a class="nav-link" href="https://www.g2b.go.kr" target="_blank" rel="noopener">나라장터</a></li>
      <li class="nav-item"><a class="nav-link" href="https://mail.naver.com" target="_blank" rel="noopener">메일</a></li>
      <li class="nav-item"><a class="nav-link" href="company_info.html">회사정보</a></li>
    </ul>
  </div>

  <main class="main-content">
    <div class="detail-header">
      <h2>거래처관리</h2>
      <div class="control-buttons">
        <button type="button" id="edit-btn" class="btn btn-primary">수정</button>
        <button type="button" id="save-btn" class="btn btn-success" style="display: none;">저장</button>
      </div>
    </div>

    <div class="customer-section">
      <table class="customer-table">
        <thead>
          <tr>
            <th style="width: 40px;"><button type="button" id="add-customer-btn" class="add-row-btn">+</button></th>
            <th>거래처명</th>
            <th>대표자</th>
            <th>사업자등록번호</th>
            <th>업태</th>
            <th>종목</th>
            <th>전화번호</th>
            <th>FAX</th>
            <th>주소</th>
          </tr>
        </thead>
        <tbody id="customer-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- 저장 확인 모달 -->
  <div class="modal fade" id="saveConfirmModal" tabindex="-1" role="dialog" aria-labelledby="saveConfirmLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="saveConfirmLabel">확인</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          저장하시겠습니까?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-primary" id="saveConfirmBtn">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 저장 완료 모달 -->
  <div class="modal fade" id="saveModal" tabindex="-1" role="dialog" aria-labelledby="saveModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="saveModalLabel">알림</h5>
        </div>
        <div class="modal-body">
          저장되었습니다.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="saveModalBtn" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/db_sync.js"></script>
  <script>
    let isEditMode = false;
    let customers = [];
    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const addCustomerBtn = document.getElementById('add-customer-btn');
    const tableBody = document.getElementById('customer-tbody');
    const saveConfirmModal = new bootstrap.Modal(document.getElementById('saveConfirmModal'));
    const saveConfirmBtn = document.getElementById('saveConfirmBtn');
    const saveModal = new bootstrap.Modal(document.getElementById('saveModal'));

    function loadCustomers() {
      const saved = localStorage.getItem('customers');
      if (saved) {
        customers = JSON.parse(saved);
      } else {
        customers = [
          { name: '삼호건설', representative: '김영수', bizNum: '123-45-67890', industryType: '건설업', businessType: '종합건설', phone: '02-1234-5678', address: '서울시 강남구', fax: '02-1234-5679' },
          { name: '대신산업', representative: '이준호', bizNum: '234-56-78901', industryType: '건설업', businessType: '토목공사', phone: '02-2345-6789', address: '서울시 서초구', fax: '02-2345-6790' },
          { name: '성진토건', representative: '박민수', bizNum: '345-67-89012', industryType: '건설업', businessType: '건축공사', phone: '031-3456-7890', address: '경기도 수원시', fax: '031-3456-7891' }
        ];
      }
      addCustomerBtn.disabled = true;
      renderCustomers();
    }

    function renderCustomers() {
      tableBody.innerHTML = customers.map((customer, index) => `
        <tr>
          <td>
            <button type="button" class="minus-btn" data-index="${index}" ${!isEditMode ? 'disabled' : ''}>−</button>
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="customer-name" value="${customer.name}" data-index="${index}">` : customer.name}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="customer-representative" value="${customer.representative}" data-index="${index}">` : customer.representative}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="customer-biznum" value="${customer.bizNum}" data-index="${index}">` : customer.bizNum}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="customer-industrytype" value="${customer.industryType}" data-index="${index}">` : customer.industryType}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="customer-businesstype" value="${customer.businessType}" data-index="${index}">` : customer.businessType}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="customer-phone" value="${customer.phone}" data-index="${index}">` : customer.phone}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="customer-fax" value="${customer.fax}" data-index="${index}">` : customer.fax}
          </td>
          <td class="left-align">
            ${isEditMode ? `<input type="text" class="customer-address" value="${customer.address}" data-index="${index}">` : customer.address}
          </td>
        </tr>
      `).join('');

      if (isEditMode) {
        setupEditEventListeners();
      }
    }

    function setupEditEventListeners() {
      document.querySelectorAll('.minus-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const index = parseInt(e.target.dataset.index);
          customers.splice(index, 1);
          renderCustomers();
        });
      });
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      editBtn.style.display = isEditMode ? 'none' : 'block';
      saveBtn.style.display = isEditMode ? 'block' : 'none';
      addCustomerBtn.disabled = !isEditMode;
      renderCustomers();
    }

    function saveCustomers() {
      const updatedCustomers = [];
      tableBody.querySelectorAll('tr').forEach(row => {
        const nameInput = row.querySelector('.customer-name');
        if (nameInput) {
          updatedCustomers.push({
            name: nameInput.value,
            representative: row.querySelector('.customer-representative').value,
            bizNum: row.querySelector('.customer-biznum').value,
            industryType: row.querySelector('.customer-industrytype').value,
            businessType: row.querySelector('.customer-businesstype').value,
            phone: row.querySelector('.customer-phone').value,
            address: row.querySelector('.customer-address').value,
            fax: row.querySelector('.customer-fax').value
          });
        }
      });
      customers = updatedCustomers;
      localStorage.setItem('customers', JSON.stringify(customers));
      isEditMode = false;
      editBtn.style.display = 'block';
      saveBtn.style.display = 'none';
      addCustomerBtn.disabled = true;
      renderCustomers();
      saveModal.show();
    }

    editBtn.addEventListener('click', toggleEditMode);
    saveBtn.addEventListener('click', () => {
      saveConfirmModal.show();
    });
    
    saveConfirmBtn.addEventListener('click', () => {
      const updatedCustomers = [];
      tableBody.querySelectorAll('tr').forEach(row => {
        const nameInput = row.querySelector('.customer-name');
        if (nameInput) {
          updatedCustomers.push({
            name: nameInput.value,
            representative: row.querySelector('.customer-representative').value,
            bizNum: row.querySelector('.customer-biznum').value,
            industryType: row.querySelector('.customer-industrytype').value,
            businessType: row.querySelector('.customer-businesstype').value,
            phone: row.querySelector('.customer-phone').value,
            fax: row.querySelector('.customer-fax').value,
            address: row.querySelector('.customer-address').value
          });
        }
      });
      customers = updatedCustomers;
      localStorage.setItem('customers', JSON.stringify(customers));
      isEditMode = false;
      editBtn.style.display = 'block';
      saveBtn.style.display = 'none';
      addCustomerBtn.disabled = true;
      renderCustomers();
      saveConfirmModal.hide();
      saveModal.show();
    });

    addCustomerBtn.addEventListener('click', () => {
      customers.push({
        name: '',
        representative: '',
        bizNum: '',
        industryType: '',
        businessType: '',
        phone: '',
        address: '',
        fax: ''
      });
      renderCustomers();
    });

    loadCustomers();
  </script>
</body>
</html>
