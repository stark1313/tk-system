<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정산관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .settlement-list-table {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .settlement-list-table table { 
      margin-bottom: 0;
      font-size: 0.9rem;
    }
    .settlement-list-table th { 
      background: #f8f9fa;
      font-weight: 600;
      border-color: rgba(0,0,0,0.08);
    }
    .settlement-list-table td {
      vertical-align: middle;
      border-color: rgba(0,0,0,0.08);
    }
    .settlement-list-table tbody tr:hover { 
      background: #f1f3f5;
      cursor: pointer;
    }
    .status-badge { 
      font-size: 11px; 
      padding: 4px 8px; 
      border-radius: 4px; 
      font-weight: 600;
      display: inline-block;
    }
    .status-unpaid { 
      background: #ffebee; 
      color: #c62828; 
    }
    .status-partial { 
      background: #fff3e0; 
      color: #e65100; 
    }
    .status-paid { 
      background: #e8f5e9; 
      color: #2e7d32; 
    }
    .amount-unpaid { 
      color: #c62828; 
      font-weight: 600; 
    }
    
    .settlement-detail {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 0.75rem;
      padding: 1.5rem;
      display: none;
    }
    .settlement-detail.active {
      display: block;
    }
    .settlement-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 1.5rem;
    }
    .settlement-header h3 { 
      margin: 0; 
      font-weight: 600;
    }
    .back-btn { 
      cursor: pointer; 
      color: #0066cc;
      font-weight: 500;
    }
    .back-btn:hover { 
      text-decoration: underline;
    }
    
    .settlement-content { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 1.5rem; 
      margin-bottom: 1.5rem;
    }
    .settlement-section { 
      background: #f8f9fa; 
      border-radius: 0.5rem; 
      padding: 1rem; 
      border: 1px solid rgba(0,0,0,0.08);
    }
    .settlement-section h5 { 
      font-weight: 600; 
      margin-bottom: 1rem; 
      color: #333;
      font-size: 0.95rem;
    }
    
    .settlement-summary {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border-radius: 0.5rem;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .summary-item { 
      text-align: center; 
    }
    .summary-label { 
      font-size: 12px; 
      color: #666; 
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .summary-value { 
      font-size: 20px; 
      font-weight: 700; 
      color: #333;
    }
    .summary-unpaid { 
      color: #c62828; 
    }
    
    .mini-table { 
      font-size: 0.85rem; 
      width: 100%; 
      border-collapse: collapse;
    }
    .mini-table th { 
      background: white; 
      font-weight: 600; 
      border-bottom: 1px solid #ddd; 
      padding: 0.75rem;
      text-align: center;
    }
    .mini-table td { 
      padding: 0.75rem;
      border-bottom: 1px solid #eee;
      text-align: center;
    }
    .mini-table td.left-align {
      text-align: left;
    }
    .mini-table td.right-align {
      text-align: right;
    }
    
    .btn-group-demo { 
      margin-top: 1rem; 
      display: flex; 
      gap: 0.5rem;
    }
    .btn-group-demo button { 
      font-size: 0.85rem;
      flex: 1;
    }

    .settlement-search-wrapper {
      position: relative;
    }

    #settlementSuggestions {
      position: absolute;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 4px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #settlementSuggestions > div {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      transition: background-color 0.1s;
    }

    #settlementSuggestions > div:last-child {
      border-bottom: none;
    }

    #settlementSuggestions > div:hover {
      background-color: #f5f5f5;
    }

    @media (max-width: 992px) {
      .settlement-content { 
        grid-template-columns: 1fr;
      }
      .settlement-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <!-- 입금 추가 모달 -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 초성 검색 함수
    function getChosung(text) {
      const chosung = [
        'ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'
      ];
      return Array.from(text).map(char => {
        const code = char.charCodeAt(0);
        if (code < 0xac00 || code > 0xd7a3) return char;
        const index = Math.floor((code - 0xac00) / 588);
        return chosung[index] || char;
      }).join('');
    }

    let settlementData = {};
    let currentCustomer = null;
    let currentPage = 1;
    const pageSize = 5;
    let filteredCustomers = [];
    const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));

    function initSettlement() {
      const savedPayments = JSON.parse(localStorage.getItem('payments') || '{}');
      const savedTransactions = JSON.parse(localStorage.getItem('transactions') || '{}');
      const customers = JSON.parse(localStorage.getItem('customers') || '[]');

      customers.forEach(customer => {
        const customerName = customer.name;
        settlementData[customerName] = {
          ...customer,
          sales: [],
          payments: savedPayments[customerName] || [],
          totalSale: 0,
          totalPaid: 0
        };
      });

      Object.keys(savedTransactions).forEach(orderId => {
        const order = savedTransactions[orderId];
        if (settlementData[order.customer]) {
          const amount = order.items.reduce((sum, item) => {
            const supply = item.quantity * item.unitPrice;
            const tax = order.taxType === 'exclude' ? 0 : Math.round(supply * 0.1);
            return sum + supply + tax;
          }, 0);
          settlementData[order.customer].sales.push({
            orderId,
            month: order.deliveryMonth,
            amount: amount,
            status: order.paymentStatus || 'unpaid'
          });
        }
      });

      Object.keys(settlementData).forEach(customerName => {
        const data = settlementData[customerName];
        data.totalSale = data.sales.reduce((sum, s) => sum + s.amount, 0);
        data.totalPaid = data.payments.reduce((sum, p) => sum + p.amount, 0);
      });

      filteredCustomers = Object.keys(settlementData).sort();
      currentPage = 1;
      renderSettlementList();
      setupSearchListener();
    }

    function renderSettlementList() {
      const tbody = document.getElementById('settlementListBody');
      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = startIdx + pageSize;
      const pageCustomers = filteredCustomers.slice(startIdx, endIdx);
      
      tbody.innerHTML = pageCustomers.map(customerName => {
        const data = settlementData[customerName];
        const unpaid = data.totalSale - data.totalPaid;
        let statusBadge = '';
        let statusClass = '';

        if (unpaid === 0) {
          statusBadge = '완료';
          statusClass = 'status-paid';
        } else if (data.totalPaid === 0) {
          statusBadge = '미입금';
          statusClass = 'status-unpaid';
        } else {
          statusBadge = '부분입금';
          statusClass = 'status-partial';
        }

        const lastMonth = data.sales.length > 0 
          ? data.sales[data.sales.length - 1].month 
          : '-';

        return `
          <tr onclick="showDetailView('${customerName}')">
            <td><strong>${customerName}</strong></td>
            <td>${lastMonth}</td>
            <td>${data.totalSale.toLocaleString()}</td>
            <td>${data.totalPaid.toLocaleString()}</td>
            <td class="${unpaid > 0 ? 'amount-unpaid' : ''}">${unpaid.toLocaleString()}</td>
            <td><span class="status-badge ${statusClass}">${statusBadge}</span></td>
          </tr>
        `;
      }).join('');

      renderPagination();
    }

    function renderPagination() {
      const paginationElement = document.getElementById('settlementPagination');
      const totalPages = Math.ceil(filteredCustomers.length / pageSize);
      
      let html = '';
      
      // 이전 버튼
      if (currentPage > 1) {
        html += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;">이전</a></li>`;
      } else {
        html += `<li class="page-item disabled"><span class="page-link">이전</span></li>`;
      }

      // 페이지 번호
      for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
          html += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
        } else {
          html += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a></li>`;
        }
      }

      // 다음 버튼
      if (currentPage < totalPages) {
        html += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;">다음</a></li>`;
      } else {
        html += `<li class="page-item disabled"><span class="page-link">다음</span></li>`;
      }

      paginationElement.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      renderSettlementList();
    }

    function setupSearchListener() {
      const searchInput = document.getElementById('settlementSearchCustomer');
      const suggestionsDiv = document.getElementById('settlementSuggestions');
      const resetBtn = document.getElementById('settlementSearchReset');

      searchInput.addEventListener('input', function() {
        const query = this.value.trim();
        
        if (!query) {
          filteredCustomers = Object.keys(settlementData).sort();
          suggestionsDiv.style.display = 'none';
        } else {
          const allCustomers = Object.keys(settlementData).sort();
          const queryChosung = getChosung(query).toUpperCase();
          
          filteredCustomers = allCustomers.filter(name => {
            const nameUpper = name.toUpperCase();
            const nameChosung = getChosung(name).toUpperCase();
            return nameUpper.includes(query.toUpperCase()) || 
                   nameChosung.includes(queryChosung);
          });

          // 자동완성 제안 표시
          const matches = allCustomers.filter(name => {
            const nameUpper = name.toUpperCase();
            const nameChosung = getChosung(name).toUpperCase();
            return nameUpper.includes(query.toUpperCase()) || 
                   nameChosung.includes(queryChosung);
          });

          if (matches.length > 0 && query.length > 0) {
            suggestionsDiv.innerHTML = matches.slice(0, 5).map(name => 
              `<div onclick="selectSuggestion('${name}')">${name}</div>`
            ).join('');
            suggestionsDiv.style.display = 'block';
          } else {
            suggestionsDiv.style.display = 'none';
          }
        }

        currentPage = 1;
        renderSettlementList();
      });

      // 검색 클릭했을 때 자동완성 숨기기
      searchInput.addEventListener('blur', () => {
        setTimeout(() => suggestionsDiv.style.display = 'none', 200);
      });

      // 자동완성 제안 표시 시 focus
      searchInput.addEventListener('focus', function() {
        if (this.value.trim() && filteredCustomers.length > 0) {
          suggestionsDiv.style.display = 'block';
        }
      });

      // 초기화 버튼
      resetBtn.addEventListener('click', () => {
        searchInput.value = '';
        filteredCustomers = Object.keys(settlementData).sort();
        currentPage = 1;
        suggestionsDiv.style.display = 'none';
        renderSettlementList();
      });
    }

    function selectSuggestion(name) {
      const searchInput = document.getElementById('settlementSearchCustomer');
      searchInput.value = name;
      document.getElementById('settlementSuggestions').style.display = 'none';
      filteredCustomers = [name];
      currentPage = 1;
      renderSettlementList();
    }

    function showDetailView(customerName) {
      currentCustomer = customerName;
      const data = settlementData[customerName];

      document.getElementById('detailCustomerName').textContent = customerName;
      document.getElementById('detailCustomerInfo').innerHTML = 
        `대표: ${data.representative} | 전화: ${data.phone}`;

      const saleBody = document.getElementById('saleRecordsBody');
      saleBody.innerHTML = data.sales.map(sale => `
        <tr>
          <td>${sale.orderId}</td>
          <td>${sale.month}</td>
          <td class="right-align">${sale.amount.toLocaleString()}</td>
          <td>
            <span class="status-badge ${sale.status === 'paid' ? 'status-paid' : 'status-unpaid'}" style="font-size:10px;">
              ${sale.status === 'paid' ? '입금완료' : '미입금'}
            </span>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="text-center">거래 기록이 없습니다.</td></tr>';

      const paymentBody = document.getElementById('paymentRecordsBody');
      paymentBody.innerHTML = data.payments.map(payment => `
        <tr>
          <td>${payment.date}</td>
          <td class="right-align">${payment.amount.toLocaleString()}</td>
          <td>${payment.targetOrders.join(', ')}</td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="text-center">입금 기록이 없습니다.</td></tr>';

      const unpaid = data.totalSale - data.totalPaid;
      document.getElementById('totalSaleAmount').textContent = data.totalSale.toLocaleString();
      document.getElementById('totalPaidAmount').textContent = data.totalPaid.toLocaleString();
      document.getElementById('unpaidAmount').textContent = unpaid.toLocaleString();

      document.getElementById('settlementListView').classList.remove('active');
      document.getElementById('settlementDetailView').classList.add('active');
    }

    function showListView() {
      document.getElementById('settlementDetailView').classList.remove('active');
      document.getElementById('settlementListView').classList.add('active');
    }

    document.getElementById('backBtn').addEventListener('click', showListView);

    document.getElementById('addPaymentBtn').addEventListener('click', () => {
      document.getElementById('paymentDate').value = '';
      document.getElementById('paymentAmount').value = '';
      document.getElementById('paymentOrders').value = '';
      paymentModal.show();
    });

    document.getElementById('savePaymentBtn').addEventListener('click', () => {
      const date = document.getElementById('paymentDate').value;
      const amount = parseInt(document.getElementById('paymentAmount').value) || 0;
      const orders = document.getElementById('paymentOrders').value
        .split(',')
        .map(o => o.trim())
        .filter(o => o);

      if (!date || amount <= 0) {
        alert('입금일자와 입금액을 입력해주세요.');
        return;
      }

      if (!settlementData[currentCustomer].payments) {
        settlementData[currentCustomer].payments = [];
      }
      settlementData[currentCustomer].payments.push({ date, amount, targetOrders: orders });

      const payments = JSON.parse(localStorage.getItem('payments') || '{}');
      payments[currentCustomer] = settlementData[currentCustomer].payments;
      localStorage.setItem('payments', JSON.stringify(payments));

      paymentModal.hide();
      showDetailView(currentCustomer);
      alert('입금 기록이 저장되었습니다.');
    });

    initSettlement();
  </script>
</body>
</html>
