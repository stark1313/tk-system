<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>품목관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .item-section {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .search-panel {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .search-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) auto auto;
      gap: 0.75rem;
      align-items: end;
    }
    .search-field label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #495057;
      margin-bottom: 0.35rem;
      display: block;
    }
    .search-field input {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border: 1px solid #ced4da;
      border-radius: 0.375rem;
      font-size: 0.9rem;
    }
    .pagination-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .pagination-info {
      font-size: 0.85rem;
      color: #6c757d;
    }
    .pagination-controls {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 36px;
      height: 36px;
      border: 1px solid #ced4da;
      border-radius: 0.375rem;
      background: #fff;
      color: #212529;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0 0.5rem;
    }
    .page-btn.active {
      background: #0d6efd;
      border-color: #0d6efd;
      color: #fff;
    }
    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    @media (max-width: 992px) {
      .search-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 576px) {
      .search-row {
        grid-template-columns: 1fr;
      }
      .search-row .btn {
        width: 100%;
      }
    }
    .item-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .item-table th,
    .item-table td {
      padding: 0.75rem;
      border: 1px solid #ddd;
      text-align: center;
    }
    .item-table th {
      background: #f8f9fa;
      font-weight: 600;
    }
    .item-table td.left-align {
      text-align: left;
    }
    .item-table input {
      width: 100%;
      padding: 0.35rem;
      border: 1px solid #ddd;
      border-radius: 0.25rem;
      font-size: 0.85rem;
      box-sizing: border-box;
    }
    .control-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .control-buttons button {
      min-width: 100px;
    }
    .add-row-btn {
      background: #28a745;
      color: white;
      border: none;
      border-radius: 0.25rem;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      padding: 0;
    }
    .add-row-btn:hover {
      background: #218838;
    }
    .add-row-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #6c757d;
    }
    .minus-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 0.25rem;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-weight: bold;
      padding: 0;
    }
    .minus-btn:hover {
      background: #c82333;
    }
    .minus-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand">
      <a href="../index.html">태경산업 주문관리 시스템</a>
    </div>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>거래관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="transaction_list.html">주문관리</a></li>
      <li class="nav-item"><a class="nav-link" href="transaction_settlement.html">정산관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기준정보</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="customer_list.html">거래처관리</a></li>
      <li class="nav-item"><a class="nav-link active" href="item_list.html">품목관리</a></li>
      <li class="nav-item"><a class="nav-link" href="form_upload.html">서식업로드</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>재고관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="inventory_list.html">재고관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기타</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="document_list.html">자료실</a></li>
      <li class="nav-item"><a class="nav-link" href="https://www.g2b.go.kr" target="_blank" rel="noopener">나라장터</a></li>
      <li class="nav-item"><a class="nav-link" href="https://mail.naver.com" target="_blank" rel="noopener">메일</a></li>
      <li class="nav-item"><a class="nav-link" href="company_info.html">회사정보</a></li>
    </ul>
  </div>

  <main class="main-content">
    <div class="detail-header">
      <h2>품목관리</h2>
      <div class="control-buttons">
        <button type="button" id="edit-btn" class="btn btn-primary">수정</button>
        <button type="button" id="save-btn" class="btn btn-success" style="display: none;">저장</button>
      </div>
    </div>

    <div class="item-section">
      <div class="search-panel">
        <form id="item-search-form" class="search-row">
          <div class="search-field">
            <label for="item-search-name">품목명</label>
            <input type="text" id="item-search-name" list="item-name-options" placeholder="품목명 검색">
            <datalist id="item-name-options"></datalist>
          </div>
          <div class="search-field">
            <label for="item-search-spec">규격</label>
            <input type="text" id="item-search-spec" list="item-spec-options" placeholder="규격 검색">
            <datalist id="item-spec-options"></datalist>
          </div>
          <div class="search-field">
            <label for="item-search-remark">비고</label>
            <input type="text" id="item-search-remark" placeholder="비고 검색">
          </div>
          <button type="submit" class="btn btn-primary">검색</button>
          <button type="button" id="item-search-reset" class="btn btn-outline-secondary">초기화</button>
        </form>
      </div>

      <table class="item-table">
        <thead>
          <tr>
            <th style="width: 40px;"><button type="button" id="add-item-btn" class="add-row-btn">+</button></th>
            <th>품목명</th>
            <th>규격</th>
            <th>단위</th>
            <th>단가</th>
            <th>비고</th>
          </tr>
        </thead>
        <tbody id="item-tbody"></tbody>
      </table>
      <div class="pagination-wrap">
        <div id="item-pagination-info" class="pagination-info"></div>
        <div id="item-pagination-controls" class="pagination-controls"></div>
      </div>
    </div>
  </main>

  <!-- 저장 확인 모달 -->
  <div class="modal fade" id="saveConfirmModal" tabindex="-1" role="dialog" aria-labelledby="saveConfirmLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="saveConfirmLabel">확인</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          저장하시겠습니까?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-primary" id="saveConfirmBtn">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 저장 완료 모달 -->
  <div class="modal fade" id="saveModal" tabindex="-1" role="dialog" aria-labelledby="saveModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="saveModalLabel">알림</h5>
        </div>
        <div class="modal-body">
          저장되었습니다.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="saveModalBtn" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app_config.js?v=20260419"></script>
  <script src="../js/db_sync.js"></script>
  <script>
    let isEditMode = false;
    let items = [];
    let filteredIndexes = [];
    let currentPage = 1;
    const itemsPerPage = 20;
    let itemSearchName = '';
    let itemSearchSpec = '';
    let itemSearchRemark = '';
    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const addItemBtn = document.getElementById('add-item-btn');
    const tableBody = document.getElementById('item-tbody');
    const itemSearchForm = document.getElementById('item-search-form');
    const itemSearchNameInput = document.getElementById('item-search-name');
    const itemSearchSpecInput = document.getElementById('item-search-spec');
    const itemSearchRemarkInput = document.getElementById('item-search-remark');
    const itemSearchResetBtn = document.getElementById('item-search-reset');
    const itemNameOptions = document.getElementById('item-name-options');
    const itemSpecOptions = document.getElementById('item-spec-options');
    const itemPaginationInfo = document.getElementById('item-pagination-info');
    const itemPaginationControls = document.getElementById('item-pagination-controls');
    const saveConfirmModal = new bootstrap.Modal(document.getElementById('saveConfirmModal'));
    const saveConfirmBtn = document.getElementById('saveConfirmBtn');
    const saveModal = new bootstrap.Modal(document.getElementById('saveModal'));
    const saveModalBtn = document.getElementById('saveModalBtn');

    function loadItems() {
      const saved = localStorage.getItem('items');
      if (saved) {
        items = JSON.parse(saved);
      } else {
        items = [
          { name: '철근', spec: 'SD400 20mm', unit: 'T', unitPrice: 650000, remark: '' },
          { name: '시멘트', spec: '포틀랜드 시멘트', unit: '포', unitPrice: 7500, remark: '' },
          { name: '모래', spec: '강모래 (세목)', unit: 'm³', unitPrice: 45000, remark: '' },
          { name: '자갈', spec: '석회석 자갈', unit: 'm³', unitPrice: 38000, remark: '' },
          { name: '합판', spec: '베니어합판 12mm', unit: '장', unitPrice: 25000, remark: '' }
        ];
      }
      addItemBtn.disabled = true;
      updateNameSuggestions();
      updateSpecSuggestions();
      renderItems();
    }

    function normalizeText(value) {
      return String(value || '').trim().toLowerCase();
    }

    function getFilteredIndexes() {
      const nameKeyword = normalizeText(itemSearchName);
      const specKeyword = normalizeText(itemSearchSpec);
      const remarkKeyword = normalizeText(itemSearchRemark);

      return items
        .map((item, index) => ({ item, index }))
        .filter(({ item }) => {
          const matchName = !nameKeyword || normalizeText(item.name).includes(nameKeyword);
          const matchSpec = !specKeyword || normalizeText(item.spec).includes(specKeyword);
          const matchRemark = !remarkKeyword || normalizeText(item.remark).includes(remarkKeyword);
          return matchName && matchSpec && matchRemark;
        })
        .map(({ index }) => index);
    }

    function getPaginationState(totalCount) {
      const totalPages = Math.max(1, Math.ceil(totalCount / itemsPerPage));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const start = (currentPage - 1) * itemsPerPage;
      const end = Math.min(start + itemsPerPage, totalCount);
      return { totalPages, start, end };
    }

    function renderPagination(totalCount, totalPages, start, end) {
      if (totalCount === 0) {
        itemPaginationInfo.textContent = '검색 결과가 없습니다.';
      } else {
        itemPaginationInfo.textContent = `총 ${totalCount}개 중 ${start + 1}-${end} 표시`;
      }

      const pageButtons = [];
      pageButtons.push(`<button type="button" class="page-btn" data-page="prev" ${currentPage === 1 ? 'disabled' : ''}>이전</button>`);

      const from = Math.max(1, currentPage - 2);
      const to = Math.min(totalPages, from + 4);
      for (let page = from; page <= to; page += 1) {
        pageButtons.push(`<button type="button" class="page-btn ${page === currentPage ? 'active' : ''}" data-page="${page}">${page}</button>`);
      }

      pageButtons.push(`<button type="button" class="page-btn" data-page="next" ${currentPage === totalPages ? 'disabled' : ''}>다음</button>`);
      itemPaginationControls.innerHTML = pageButtons.join('');

      itemPaginationControls.querySelectorAll('.page-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const pageValue = btn.dataset.page;
          if (pageValue === 'prev' && currentPage > 1) {
            currentPage -= 1;
          } else if (pageValue === 'next' && currentPage < totalPages) {
            currentPage += 1;
          } else if (pageValue !== 'prev' && pageValue !== 'next') {
            currentPage = parseInt(pageValue, 10);
          }
          renderItems();
        });
      });
    }

    function updateNameSuggestions() {
      const uniqueNames = Array.from(new Set(items.map((item) => String(item.name || '').trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'ko'));
      itemNameOptions.innerHTML = uniqueNames.map((name) => `<option value="${name}"></option>`).join('');
    }

    function updateSpecSuggestions() {
      const nameKeyword = normalizeText(itemSearchNameInput.value);
      const specs = Array.from(new Set(
        items
          .filter((item) => !nameKeyword || normalizeText(item.name).includes(nameKeyword))
          .map((item) => String(item.spec || '').trim())
          .filter(Boolean)
      )).sort((a, b) => a.localeCompare(b, 'ko'));
      itemSpecOptions.innerHTML = specs.map((spec) => `<option value="${spec}"></option>`).join('');
    }

    function renderItems() {
      filteredIndexes = getFilteredIndexes();
      const { totalPages, start, end } = getPaginationState(filteredIndexes.length);
      const pageIndexes = filteredIndexes.slice(start, end);

      tableBody.innerHTML = pageIndexes.map((itemIndex) => {
        const item = items[itemIndex];
        return `
        <tr>
          <td>
            <button type="button" class="minus-btn" data-index="${itemIndex}" ${!isEditMode ? 'disabled' : ''}>−</button>
          </td>
          <td class="left-align">
            ${isEditMode ? `<input type="text" class="item-name" value="${item.name}" data-index="${itemIndex}">` : item.name}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="item-spec" value="${item.spec}" data-index="${itemIndex}">` : item.spec}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="item-unit" value="${item.unit}" data-index="${itemIndex}">` : item.unit}
          </td>
          <td>
            ${isEditMode ? `<input type="number" class="item-unitprice" value="${item.unitPrice}" data-index="${itemIndex}">` : item.unitPrice.toLocaleString()}
          </td>
          <td class="left-align">
            ${isEditMode ? `<input type="text" class="item-remark" value="${item.remark || ''}" data-index="${itemIndex}">` : (item.remark || '')}
          </td>
        </tr>
      `;
      }).join('');

      renderPagination(filteredIndexes.length, totalPages, start, end);

      if (isEditMode) {
        setupEditEventListeners();
      }
    }

    function setupEditEventListeners() {
      document.querySelectorAll('.minus-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const index = parseInt(e.target.dataset.index);
          items.splice(index, 1);
          updateNameSuggestions();
          updateSpecSuggestions();
          renderItems();
        });
      });

      document.querySelectorAll('.item-name').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index, 10);
          items[index].name = e.target.value;
          updateNameSuggestions();
          updateSpecSuggestions();
        });
      });

      document.querySelectorAll('.item-spec').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index, 10);
          items[index].spec = e.target.value;
          updateSpecSuggestions();
        });
      });

      document.querySelectorAll('.item-unit').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index, 10);
          items[index].unit = e.target.value;
        });
      });

      document.querySelectorAll('.item-unitprice').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index, 10);
          items[index].unitPrice = parseInt(e.target.value, 10) || 0;
        });
      });

      document.querySelectorAll('.item-remark').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.index, 10);
          items[index].remark = e.target.value;
        });
      });
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      editBtn.style.display = isEditMode ? 'none' : 'block';
      saveBtn.style.display = isEditMode ? 'block' : 'none';
      addItemBtn.disabled = !isEditMode;
      renderItems();
    }

    function saveItems() {
      localStorage.setItem('items', JSON.stringify(items));
      isEditMode = false;
      editBtn.style.display = 'block';
      saveBtn.style.display = 'none';
      addItemBtn.disabled = true;
      updateNameSuggestions();
      updateSpecSuggestions();
      renderItems();
      saveModal.show();
    }

    editBtn.addEventListener('click', toggleEditMode);
    saveBtn.addEventListener('click', () => {
      saveConfirmModal.show();
    });
    saveConfirmBtn.addEventListener('click', () => {
      saveConfirmModal.hide();
      saveItems();
    });
    saveModalBtn.addEventListener('click', () => {
      saveModal.hide();
    });

    addItemBtn.addEventListener('click', () => {
      items.push({
        name: '',
        spec: '',
        unit: '',
        unitPrice: 0,
        remark: ''
      });
      currentPage = Math.max(1, Math.ceil(items.length / itemsPerPage));
      updateNameSuggestions();
      updateSpecSuggestions();
      renderItems();
    });

    itemSearchNameInput.addEventListener('input', () => {
      updateSpecSuggestions();
    });

    itemSearchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      itemSearchName = itemSearchNameInput.value;
      itemSearchSpec = itemSearchSpecInput.value;
      itemSearchRemark = itemSearchRemarkInput.value;
      currentPage = 1;
      renderItems();
    });

    itemSearchResetBtn.addEventListener('click', () => {
      itemSearchName = '';
      itemSearchSpec = '';
      itemSearchRemark = '';
      itemSearchNameInput.value = '';
      itemSearchSpecInput.value = '';
      itemSearchRemarkInput.value = '';
      currentPage = 1;
      renderItems();
    });

    loadItems();
  </script>
</body>
