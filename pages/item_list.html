<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>품목관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .item-section {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .item-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .item-table th,
    .item-table td {
      padding: 0.75rem;
      border: 1px solid #ddd;
      text-align: center;
    }
    .item-table th {
      background: #f8f9fa;
      font-weight: 600;
    }
    .item-table td.left-align {
      text-align: left;
    }
    .item-table input {
      width: 100%;
      padding: 0.35rem;
      border: 1px solid #ddd;
      border-radius: 0.25rem;
      font-size: 0.85rem;
      box-sizing: border-box;
    }
    .control-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .control-buttons button {
      min-width: 100px;
    }
    .add-row-btn {
      background: #28a745;
      color: white;
      border: none;
      border-radius: 0.25rem;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      padding: 0;
    }
    .add-row-btn:hover {
      background: #218838;
    }
    .add-row-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #6c757d;
    }
    .minus-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 0.25rem;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-weight: bold;
      padding: 0;
    }
    .minus-btn:hover {
      background: #c82333;
    }
    .minus-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand">
      <a href="../index.html">태경산업 주문관리 시스템</a>
    </div>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>거래관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="transaction_list.html">주문관리</a></li>
      <li class="nav-item"><a class="nav-link" href="transaction_settlement.html">정산관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기준정보</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="customer_list.html">거래처관리</a></li>
      <li class="nav-item"><a class="nav-link active" href="item_list.html">품목관리</a></li>
      <li class="nav-item"><a class="nav-link" href="form_upload.html">서식업로드</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>재고관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="inventory_list.html">재고관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기타</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="document_list.html">자료실</a></li>
      <li class="nav-item"><a class="nav-link" href="https://www.g2b.go.kr" target="_blank" rel="noopener">나라장터</a></li>
      <li class="nav-item"><a class="nav-link" href="https://mail.naver.com" target="_blank" rel="noopener">메일</a></li>
      <li class="nav-item"><a class="nav-link" href="company_info.html">회사정보</a></li>
    </ul>
  </div>

  <main class="main-content">
    <div class="detail-header">
      <h2>품목관리</h2>
      <div class="control-buttons">
        <button type="button" id="edit-btn" class="btn btn-primary">수정</button>
        <button type="button" id="save-btn" class="btn btn-success" style="display: none;">저장</button>
      </div>
    </div>

    <div class="item-section">
      <table class="item-table">
        <thead>
          <tr>
            <th style="width: 40px;"><button type="button" id="add-item-btn" class="add-row-btn">+</button></th>
            <th>품목명</th>
            <th>규격</th>
            <th>단위</th>
            <th>단가</th>
            <th>비고</th>
          </tr>
        </thead>
        <tbody id="item-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- 저장 확인 모달 -->
  <div class="modal fade" id="saveConfirmModal" tabindex="-1" role="dialog" aria-labelledby="saveConfirmLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="saveConfirmLabel">확인</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          저장하시겠습니까?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-primary" id="saveConfirmBtn">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 저장 완료 모달 -->
  <div class="modal fade" id="saveModal" tabindex="-1" role="dialog" aria-labelledby="saveModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="saveModalLabel">알림</h5>
        </div>
        <div class="modal-body">
          저장되었습니다.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="saveModalBtn" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app_config.js"></script>
  <script src="../js/db_sync.js"></script>
  <script>
    let isEditMode = false;
    let items = [];
    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const addItemBtn = document.getElementById('add-item-btn');
    const tableBody = document.getElementById('item-tbody');
    const saveConfirmModal = new bootstrap.Modal(document.getElementById('saveConfirmModal'));
    const saveConfirmBtn = document.getElementById('saveConfirmBtn');
    const saveModal = new bootstrap.Modal(document.getElementById('saveModal'));
    const saveModalBtn = document.getElementById('saveModalBtn');

    function loadItems() {
      const saved = localStorage.getItem('items');
      if (saved) {
        items = JSON.parse(saved);
      } else {
        items = [
          { name: '철근', spec: 'SD400 20mm', unit: 'T', unitPrice: 650000, remark: '' },
          { name: '시멘트', spec: '포틀랜드 시멘트', unit: '포', unitPrice: 7500, remark: '' },
          { name: '모래', spec: '강모래 (세목)', unit: 'm³', unitPrice: 45000, remark: '' },
          { name: '자갈', spec: '석회석 자갈', unit: 'm³', unitPrice: 38000, remark: '' },
          { name: '합판', spec: '베니어합판 12mm', unit: '장', unitPrice: 25000, remark: '' }
        ];
      }
      addItemBtn.disabled = true;
      renderItems();
    }

    function renderItems() {
      tableBody.innerHTML = items.map((item, index) => `
        <tr>
          <td>
            <button type="button" class="minus-btn" data-index="${index}" ${!isEditMode ? 'disabled' : ''}>−</button>
          </td>
          <td class="left-align">
            ${isEditMode ? `<input type="text" class="item-name" value="${item.name}" data-index="${index}">` : item.name}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="item-spec" value="${item.spec}" data-index="${index}">` : item.spec}
          </td>
          <td>
            ${isEditMode ? `<input type="text" class="item-unit" value="${item.unit}" data-index="${index}">` : item.unit}
          </td>
          <td>
            ${isEditMode ? `<input type="number" class="item-unitprice" value="${item.unitPrice}" data-index="${index}">` : item.unitPrice.toLocaleString()}
          </td>
          <td class="left-align">
            ${isEditMode ? `<input type="text" class="item-remark" value="${item.remark || ''}" data-index="${index}">` : (item.remark || '')}
          </td>
        </tr>
      `).join('');

      if (isEditMode) {
        setupEditEventListeners();
      }
    }

    function setupEditEventListeners() {
      document.querySelectorAll('.minus-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const index = parseInt(e.target.dataset.index);
          items.splice(index, 1);
          renderItems();
        });
      });
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      editBtn.style.display = isEditMode ? 'none' : 'block';
      saveBtn.style.display = isEditMode ? 'block' : 'none';
      addItemBtn.disabled = !isEditMode;
      renderItems();
    }

    function saveItems() {
      const updatedItems = [];
      tableBody.querySelectorAll('tr').forEach(row => {
        const nameInput = row.querySelector('.item-name');
        if (nameInput) {
          updatedItems.push({
            name: nameInput.value,
            spec: row.querySelector('.item-spec').value,
            unit: row.querySelector('.item-unit').value,
            unitPrice: parseInt(row.querySelector('.item-unitprice').value) || 0,
            remark: row.querySelector('.item-remark').value || ''
          });
        }
      });
      items = updatedItems;
      localStorage.setItem('items', JSON.stringify(items));
      isEditMode = false;
      editBtn.style.display = 'block';
      saveBtn.style.display = 'none';
      addItemBtn.disabled = true;
      renderItems();
      saveModal.show();
    }

    editBtn.addEventListener('click', toggleEditMode);
    saveBtn.addEventListener('click', () => {
      saveConfirmModal.show();
    });
    saveConfirmBtn.addEventListener('click', () => {
      saveConfirmModal.hide();
      saveItems();
    });
    saveModalBtn.addEventListener('click', () => {
      saveModal.hide();
    });

    addItemBtn.addEventListener('click', () => {
      items.push({
        name: '',
        spec: '',
        unit: '',
        unitPrice: 0,
        remark: ''
      });
      renderItems();
    });

    loadItems();
  </script>
</body>
</html>
