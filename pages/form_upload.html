<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서식업로드</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .upload-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .upload-card {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 0.75rem;
      padding: 1rem;
    }

    .upload-card h5 {
      margin: 0;
      font-weight: 700;
      font-size: 1rem;
    }

    .upload-meta {
      margin-top: 0.75rem;
      color: #666;
      font-size: 0.88rem;
      min-height: 2.6rem;
    }

    .upload-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    .upload-status {
      display: inline-flex;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
      margin-top: 0.4rem;
    }

    .upload-status.uploaded {
      color: #2e7d32;
      background: #e8f5e9;
    }

    .upload-status.empty {
      color: #c62828;
      background: #ffebee;
    }

    .upload-guide {
      background: #f8f9fa;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
      color: #444;
      font-size: 0.92rem;
    }

    @media (max-width: 992px) {
      .upload-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand">
      <a href="../index.html">태경산업 주문관리 시스템</a>
    </div>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>거래관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="transaction_list.html">주문관리</a></li>
      <li class="nav-item"><a class="nav-link" href="transaction_settlement.html">정산관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기준정보</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="customer_list.html">거래처관리</a></li>
      <li class="nav-item"><a class="nav-link" href="item_list.html">품목관리</a></li>
      <li class="nav-item"><a class="nav-link active" href="form_upload.html">서식업로드</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>재고관리</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="inventory_list.html">재고관리</a></li>
    </ul>
    <div class="sidebar-category" data-toggle><span class="cat-toggle">⌵</span>기타</div>
    <ul class="sidebar-nav sidebar-sub">
      <li class="nav-item"><a class="nav-link" href="document_list.html">자료실</a></li>
      <li class="nav-item"><a class="nav-link" href="https://www.g2b.go.kr" target="_blank" rel="noopener">나라장터</a></li>
      <li class="nav-item"><a class="nav-link" href="https://mail.naver.com" target="_blank" rel="noopener">메일</a></li>
      <li class="nav-item"><a class="nav-link" href="company_info.html">회사정보</a></li>
    </ul>
  </div>

  <main class="main-content">
    <div class="upload-header">
      <h2>서식업로드</h2>
      <button type="button" class="btn btn-outline-secondary" id="refreshTemplatesBtn">새로고침</button>
    </div>

    <div class="upload-guide">
      주문 상세내역에서 문서 생성 시 서버에 업로드된 서식을 사용합니다. 먼저 견적서를 포함한 5개 서식을 업로드해 주세요.
    </div>

    <div id="templateMessage" class="alert d-none" role="alert"></div>

    <section class="upload-grid" id="uploadGrid"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app_config.js?v=20260420"></script>
  <script src="../js/db_sync.js"></script>
  <script>
    const API_BASE = (window.TK_CONFIG && window.TK_CONFIG.API_BASE) || 'http://localhost:5050';
    const templateTypes = [
      { key: 'estimate', label: '견적서' },
      { key: 'delivery', label: '납품서' },
      { key: 'invoice', label: '청구서' },
      { key: 'statement', label: '거래명세서' },
      { key: 'taxInvoice', label: '세금계산서' }
    ];

    const uploadGrid = document.getElementById('uploadGrid');
    const templateMessage = document.getElementById('templateMessage');
    const refreshTemplatesBtn = document.getElementById('refreshTemplatesBtn');

    let templates = {};

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function formatBytes(bytes) {
      const size = Number(bytes) || 0;
      if (!size) return '0 B';
      if (size < 1024) return size + ' B';
      if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB';
      return (size / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function showMessage(type, message) {
      templateMessage.className = 'alert alert-' + type;
      templateMessage.textContent = message;
      templateMessage.classList.remove('d-none');
    }

    function clearMessage() {
      templateMessage.classList.add('d-none');
      templateMessage.textContent = '';
    }

    function renderCards() {
      uploadGrid.innerHTML = templateTypes.map(({ key, label }) => {
        const info = templates[key] || {};
        const uploaded = !!info.uploaded;

        const statusClass = uploaded ? 'uploaded' : 'empty';
        const statusText = uploaded ? '업로드 완료' : '미업로드';
        const fileName = uploaded ? info.fileName : '업로드된 파일 없음';
        const savedAt = uploaded ? formatDate(info.savedAt) : '-';
        const size = uploaded ? formatBytes(info.size) : '-';

        return `
          <div class="upload-card">
            <h5>${label}</h5>
            <span class="upload-status ${statusClass}">${statusText}</span>
            <div class="upload-meta">
              <div>파일명: ${fileName}</div>
              <div>업로드: ${savedAt}</div>
              <div>크기: ${size}</div>
            </div>
            <div class="upload-actions">
              <input type="file" id="file-${key}" class="d-none" accept=".xlsx,.xls,.xlsm,.xltx,.xltm">
              <button type="button" class="btn btn-sm btn-primary" onclick="triggerFile('${key}')">업로드</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" ${uploaded ? '' : 'disabled'} onclick="downloadTemplate('${key}')">다운로드</button>
              <button type="button" class="btn btn-sm btn-outline-danger" ${uploaded ? '' : 'disabled'} onclick="deleteTemplate('${key}')">삭제</button>
            </div>
          </div>
        `;
      }).join('');

      templateTypes.forEach(({ key }) => {
        const input = document.getElementById('file-' + key);
        input.addEventListener('change', async (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          await uploadTemplate(key, file);
          event.target.value = '';
        });
      });
    }

    async function fetchTemplates() {
      try {
        const response = await fetch(API_BASE + '/api/templates');
        if (!response.ok) throw new Error('서식 조회 실패');
        const payload = await response.json();
        templates = payload.templates || {};
        renderCards();
      } catch (error) {
        showMessage('danger', '서식 정보를 가져오지 못했습니다. 서버가 실행 중인지 확인해 주세요.');
      }
    }

    function triggerFile(key) {
      clearMessage();
      const input = document.getElementById('file-' + key);
      if (input) input.click();
    }

    async function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || '');
          const base64 = result.includes(',') ? result.split(',')[1] : '';
          resolve(base64);
        };
        reader.onerror = () => reject(new Error('파일 읽기 실패'));
        reader.readAsDataURL(file);
      });
    }

    async function uploadTemplate(key, file) {
      try {
        clearMessage();
        const contentBase64 = await readFileAsBase64(file);
        const response = await fetch(API_BASE + '/api/templates', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            templateType: key,
            fileName: file.name,
            contentBase64
          })
        });

        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || '업로드 실패');
        }

        templates = payload.templates || {};
        renderCards();
        showMessage('success', '서식이 업로드되었습니다.');
      } catch (error) {
        showMessage('danger', '업로드에 실패했습니다: ' + error.message);
      }
    }

    async function deleteTemplate(key) {
      try {
        clearMessage();
        const response = await fetch(API_BASE + '/api/templates/' + key, {
          method: 'DELETE'
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || '삭제 실패');
        }

        templates = payload.templates || {};
        renderCards();
        showMessage('warning', '서식이 삭제되었습니다.');
      } catch (error) {
        showMessage('danger', '삭제에 실패했습니다: ' + error.message);
      }
    }

    async function downloadTemplate(key) {
      try {
        clearMessage();
        const response = await fetch(API_BASE + '/api/templates/' + key + '/download');
        if (!response.ok) throw new Error('다운로드 실패');
        const blob = await response.blob();

        const info = templates[key] || {};
        const fileName = info.fileName || (key + '.xlsx');

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (error) {
        showMessage('danger', '다운로드에 실패했습니다: ' + error.message);
      }
    }

    window.downloadTemplate = downloadTemplate;
    window.deleteTemplate = deleteTemplate;
    window.triggerFile = triggerFile;

    refreshTemplatesBtn.addEventListener('click', fetchTemplates);

    fetchTemplates();
  </script>
</body>
</html>
