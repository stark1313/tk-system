services:
  - type: web
    name: tk-system-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python estimate_server.py
    envVars:
      - key: OUTPUT_DIR
        value: /tmp/tk_system_output
      - key: DISABLE_AUTO_OPEN
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STATE_TABLE
        value: tk_app_state
      - key: SUPABASE_STATE_ROW_ID
        value: primary
      - key: SUPABASE_TEMPLATE_BUCKET
        value: tk-templates
