services:
  - type: web
    name: tk-system-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python estimate_server.py
    disk:
      name: tk-system-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_ROOT
        value: /var/data/tk_system_data
      - key: DISABLE_AUTO_OPEN
        value: "1"
